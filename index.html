<!DOCTYPE html>
<html lang="ja">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Tabita - 毎日のタスクを、もっと軽く</title>
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>

<body class="bg-gray-50 text-gray-800">
  <main>
    <!-- ヒーロー: 背景は画面いっぱい、中身だけ幅を絞って中央へ -->
    <section class="bg-blue-50 py-20 px-6 text-center">
      <div class="max-w-3xl mx-auto">
        <h1 class="font-bold text-3xl md:text-5xl text-gray-900">毎日のタスクを、もっと軽く</h1>
        <p class="text-gray-600 mt-4">Tabita はチームと個人のタスクを 1 つにまとめる、シンプルなタスク管理ツールです。</p>
        <div class="flex gap-4 justify-center mt-8">
          <button class="px-6 py-3 bg-blue-600 text-white font-semibold rounded-md hover:bg-blue-700">無料で始める</button>
          <button
            class="px-6 py-3 border border-blue-600 text-blue-600 font-semibold rounded-md hover:bg-blue-100">機能を見る</button>
        </div>
      </div>
    </section>

    <!-- 機能: スマホは1列、md以上で3列 -->
    <section class="py-16 px-6">
      <div class="max-w-5xl mx-auto">
        <h2 class="text-2xl md:text-3xl font-bold text-center text-gray-900">主な機能</h2>

        <div class="grid grid-cols-1 md:grid-cols-3 gap-6 mt-10">
          <!-- カード1 -->
          <div class="bg-white rounded-xl shadow-md p-6">
            <div class="w-10 h-10 bg-blue-500 rounded-lg"></div>
            <h3 class="text-lg font-semibold text-gray-900 mt-4">簡単追加</h3>
            <p class="text-sm text-gray-600 mt-2">ワンクリックでタスクを作成でき、面倒な入力は要りません。</p>
          </div>

          <!-- カード2 -->
          <div class="bg-white rounded-xl shadow-md p-6">
            <div class="w-10 h-10 bg-green-500 rounded-lg"></div>
            <h3 class="text-lg font-semibold text-gray-900 mt-4">チーム共有</h3>
            <p class="text-sm text-gray-600 mt-2">メンバー間で進捗をリアルタイムに見える化します。</p>
          </div>

          <!-- カード3 -->
          <div class="bg-white rounded-xl shadow-md p-6">
            <div class="w-10 h-10 bg-amber-500 rounded-lg"></div>
            <h3 class="text-lg font-semibold text-gray-900 mt-4">通知連携</h3>
            <p class="text-sm text-gray-600 mt-2">Slack やメールに重要なタスクを自動で通知します。</p>
          </div>
        </div>
      </div>
    </section>
  </main>
</body>

</html>

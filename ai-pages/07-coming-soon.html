<!DOCTYPE html>
<html lang="ja">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Coming Soon | Lumina</title>
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>

<!-- 画面の高さいっぱい(min-h-screen)の真ん中に中身を置く -->
<body class="min-h-screen flex flex-col bg-linear-to-br from-indigo-700 to-purple-600 text-white">
  <main class="grow flex items-center justify-center px-6 py-16">
    <div class="max-w-xl text-center">
      <p class="text-sm font-semibold tracking-widest text-indigo-200">COMING SOON</p>
      <h1 class="mt-4 text-4xl md:text-6xl font-bold">Lumina</h1>
      <p class="mt-6 text-lg text-indigo-100">写真をもっと手軽に整理できるアプリを準備しています。<br class="hidden md:inline">公開は 2027 年春の予定です。</p>

      <!-- お知らせ登録フォーム(見た目だけ。送信先はまだない) -->
      <form action="#" class="mt-10 flex flex-col sm:flex-row gap-3">
        <label for="email" class="sr-only">メールアドレス</label>
        <input id="email" type="email" required placeholder="you@example.com"
          class="grow px-4 py-3 rounded-md bg-white text-gray-900 placeholder-gray-400 focus:outline-none focus:ring-2 focus:ring-amber-300">
        <button type="submit" class="px-6 py-3 bg-amber-400 text-amber-950 font-semibold rounded-md hover:bg-amber-300">公開を知らせてもらう</button>
      </form>
      <p class="mt-3 text-xs text-indigo-200">登録したメールアドレスには、公開のお知らせだけをお送りします。</p>
    </div>
  </main>

  <footer class="py-6 text-center text-sm text-indigo-200">© 2026 Lumina</footer>
</body>

</html>

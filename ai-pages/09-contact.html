<!DOCTYPE html>
<html lang="ja">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>お問い合わせ | Tabita</title>
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>

<body class="bg-gray-50 text-gray-800">
  <header class="bg-white border-b border-gray-200">
    <div class="max-w-5xl mx-auto px-6 py-4">
      <a href="#" class="text-xl font-bold text-blue-600">Tabita</a>
    </div>
  </header>

  <main class="py-12 md:py-16 px-6">
    <div class="max-w-5xl mx-auto">
      <h1 class="text-3xl md:text-4xl font-bold text-gray-900">お問い合わせ</h1>
      <p class="mt-3 text-gray-600">ご質問やご相談は、下のフォームからお送りください。</p>

      <!-- スマホ: フォーム→連絡先の縦並び / md以上: フォーム2列分 + 連絡先 -->
      <div class="mt-10 grid grid-cols-1 md:grid-cols-3 gap-8">
        <!-- フォーム(見た目だけ。送信先はまだない) -->
        <form action="#" class="md:col-span-2 bg-white rounded-xl shadow-md p-6 md:p-8 space-y-6">
          <div>
            <label for="name" class="block text-sm font-semibold text-gray-900">お名前 <span class="text-red-600">*</span></label>
            <input id="name" type="text" required class="mt-2 w-full px-4 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500">
          </div>

          <div>
            <label for="email" class="block text-sm font-semibold text-gray-900">メールアドレス <span class="text-red-600">*</span></label>
            <input id="email" type="email" required placeholder="you@example.com" class="mt-2 w-full px-4 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500">
          </div>

          <div>
            <label for="topic" class="block text-sm font-semibold text-gray-900">お問い合わせの種類</label>
            <select id="topic" class="mt-2 w-full px-4 py-2 border border-gray-300 rounded-md bg-white focus:outline-none focus:ring-2 focus:ring-blue-500">
              <option>サービスについて</option>
              <option>料金プランについて</option>
              <option>不具合の報告</option>
              <option>その他</option>
            </select>
          </div>

          <div>
            <label for="message" class="block text-sm font-semibold text-gray-900">お問い合わせ内容 <span class="text-red-600">*</span></label>
            <textarea id="message" rows="6" required class="mt-2 w-full px-4 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500"></textarea>
          </div>

          <div class="flex items-start gap-3">
            <input id="agree" type="checkbox" required class="mt-1 w-4 h-4 accent-blue-600">
            <label for="agree" class="text-sm text-gray-600">プライバシーポリシーに同意します</label>
          </div>

          <button type="submit" class="w-full md:w-auto px-8 py-3 bg-blue-600 text-white font-semibold rounded-md hover:bg-blue-700">送信する</button>
        </form>

        <!-- 連絡先 -->
        <aside class="space-y-6">
          <section class="bg-white rounded-xl shadow-md p-6">
            <h2 class="font-semibold text-gray-900">メール</h2>
            <p class="mt-2 text-sm text-gray-600">support@example.com</p>
          </section>
          <section class="bg-white rounded-xl shadow-md p-6">
            <h2 class="font-semibold text-gray-900">返信の目安</h2>
            <p class="mt-2 text-sm text-gray-600">2営業日以内にご返信します(土日祝は休み)。</p>
          </section>
        </aside>
      </div>
    </div>
  </main>

  <footer class="bg-gray-800 text-gray-300 py-8 text-center text-sm">© 2026 Tabita</footer>
</body>

</html>
